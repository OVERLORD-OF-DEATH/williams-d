<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WILLIAMS D - Citations</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#fff;color:#111;min-height:100vh;position:relative}
.bg-char{position:fixed;inset:0;z-index:0;opacity:0.16;transition:0.8s}
.bg-char img{width:100%;height:100%;object-fit:cover}
.bg-gradient{position:fixed;inset:0;z-index:1;background:linear-gradient(to bottom, rgba(255,255,255,0.2), rgba(255,255,255,0.9) 60%, #fff)}
.main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 90px}
.logo{font-weight:800;font-size:14px;letter-spacing:6px;border:2px solid #111;padding:8px 18px;border-radius:30px;margin-bottom:24px}
.card{background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border:1px solid rgba(0,0,0,0.07);border-radius:28px;padding:34px 28px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.08)}
.categorie{font-size:10px;letter-spacing:3px;font-weight:700;padding:6px 14px;border-radius:20px;background:#111;color:#fff;display:inline-block;margin-bottom:16px;text-transform:uppercase}
.citation{font-size:21px;font-weight:300;line-height:1.5;min-height:70px}
.auteur{font-size:13px;font-weight:600;color:#888;margin-top:12px}.auteur span{color:#111}
.actions{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;padding:13px;border-radius:14px;border:none;font-weight:700;font-size:12px;cursor:pointer}
.btn-black{background:#111;color:#fff}.btn-white{background:#fff;color:#111;border:1px solid #ddd}
.time-badge{position:fixed;top:16px;right:16px;z-index:5;background:#fff;border:1px solid #eee;padding:6px 12px;border-radius:20px;font-size:10px;font-weight:700}
.char-name{position:fixed;bottom:86px;left:16px;z-index:5;background:#fff;border:1px solid #eee;padding:6px 12px;border-radius:20px;font-size:10px;font-weight:700}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-top:1px solid #eee;padding:14px 20px;display:flex;justify-content:center}
.btn-voir{width:100%;max-width:520px;padding:16px;background:#111;color:#fff;border:none;border-radius:16px;font-weight:800;letter-spacing:2px;font-size:12px;cursor:pointer}
#overlay{position:fixed;inset:0;z-index:20;background:#fff;display:none;flex-direction:column}
#overlay.active{display:flex}
.overlay-head{padding:18px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
.overlay-title{font-weight:800;letter-spacing:4px;font-size:13px}
.overlay-close{width:36px;height:36px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:18px;cursor:pointer}
.search-box{margin:16px 20px;padding:14px 16px;border-radius:14px;border:1px solid #eee;background:#f9f9f9;width:calc(100% - 40px);font-size:14px;outline:none}
.list{flex:1;overflow-y:auto;padding:0 16px 30px;display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:700px){.list{grid-template-columns:1fr 1fr}}
.item{position:relative;border-radius:20px;overflow:hidden;min-height:160px;border:1px solid #eee;background:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.item-bg{position:absolute;inset:0;z-index:0}.item-bg img{width:100%;height:100%;object-fit:cover;opacity:0.28}
.item-gradient{position:absolute;inset:0;z-index:1;background:linear-gradient(to top, rgba(255,255,255,0.95) 30%, rgba(255,255,255,0.6))}
.item-content{position:relative;z-index:2;padding:16px}
.item-cat{font-size:9px;letter-spacing:2px;font-weight:700;background:#111;color:#fff;padding:4px 8px;border-radius:10px;display:inline-block;margin-bottom:6px}
.item-text{font-size:14px;font-weight:500;line-height:1.4;color:#111}
.item-author{font-size:11px;color:#777;margin-top:6px;font-weight:600}
.item-char{position:absolute;top:10px;right:10px;z-index:3;background:#fff;padding:4px 8px;border-radius:20px;font-size:9px;font-weight:800;border:1px solid #eee}
</style>
</head>
<body>
<div class="bg-char"><img id="bgImg" src="https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=800"></div>
<div class="bg-gradient"></div>
<div class="time-badge" id="timeBadge"></div>
<div class="char-name" id="charName"></div>
<div class="main">
<div class="logo">WILLIAMS D</div>
<div class="card">
<div class="categorie" id="cat"></div>
<div class="citation" id="citation"></div>
<div class="auteur">— <span id="auteur"></span></div>
<div class="actions">
<button class="btn btn-white" onclick="partager()">PARTAGER</button>
<button class="btn btn-black" onclick="nouvelleCitation()">NOUVELLE ✨</button>
</div>
</div>
</div>
<div class="bottom-bar"><button class="btn-voir" onclick="ouvrirTout()">VOIR TOUT • 1100 CITATIONS →</button></div>
<div id="overlay">
<div class="overlay-head"><div class="overlay-title">WILLIAMS D • 1100</div><button class="overlay-close" onclick="fermerTout()">✕</button></div>
<input class="search-box" id="search" placeholder="Rechercher amour, motivation, foi..." oninput="filtrer()">
<div class="list" id="list"></div>
</div>
<script>
const persos=[{name:"NARUTO"},{name:"GOKU"},{name:"LUFFY"},{name:"SASUKE"},{name:"GOJO"},{name:"TANJIRO"},{name:"EREN"},{name:"ZORO"},{name:"LEVI"},{name:"DEKU"},{name:"ITACHI"},{name:"NEZUKO"}];
const animeImgs=["https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=600","https://images.unsplash.com/photo-1608346128025-1896b97a6fa7?w=600","https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?w=600","https://images.unsplash.com/photo-1578632292335-df3ab3100d13?w=600","https://images.unsplash.com/photo-1560972550-aba3456b5564?w=600","https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600","https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600","https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600"];
const base=[["Crois en toi et tout devient possible.","WILLIAMS D","MOTIVATION"],["L'amour ne se voit pas avec les yeux, mais avec le cœur.","Shakespeare","AMOUR"],["La vie, c'est ce qui arrive quand tu fais d'autres projets.","John Lennon","VIE"],["La sagesse commence dans l'émerveillement.","Socrate","SAGESSE"],["Le succès vient avant le travail seulement dans le dictionnaire.","Vidal Sassoon","RÉUSSITE"],["Dieu ne t'abandonnera jamais.","WILLIAMS D","FOI"],["Chaque matin est une nouvelle chance.","WILLIAMS D","MATIN"],["La nuit porte conseil, le matin apporte la solution.","Proverbe Africain","SOIR"],["N'attends pas le moment parfait, crée-le.","WILLIAMS D","MOTIVATION"],["Tu es plus fort que tu ne le penses.","WILLIAMS D","MOTIVATION"],["Aimer, c'est trouver sa richesse hors de soi.","Alain","AMOUR"],["Vis comme si tu devais mourir demain.","Gandhi","VIE"],["Travaille en silence, laisse le succès faire du bruit.","WILLIAMS D","RÉUSSITE"],["Le silence est parfois la meilleure réponse.","Dalaï Lama","SAGESSE"],["La foi déplace les montagnes.","Bible","FOI"],["Le bonheur se cache dans les petites choses.","WILLIAMS D","VIE"],["Lève-toi, le monde t'attend.","WILLIAMS D","MATIN"],["Les étoiles brillent plus fort dans le noir.","WILLIAMS D","SOIR"],["Le vrai amour ne meurt jamais.","WILLIAMS D","AMOUR"],["Connais-toi toi-même.","Socrate","SAGESSE"]];
let all=[];let charForEach=[];
for(let i=0;i<55;i++){base.forEach((b,j)=>{all.push({c:b[0]+" #"+(all.length+1),a:b[1],cat:b[2]});charForEach.push(persos[(all.length+j)%persos.length]);});}
function afficher(ci){let cit=all[ci];let perso=charForEach[ci];document.getElementById('citation').innerText=cit.c;document.getElementById('auteur').innerText=cit.a;document.getElementById('cat').innerText=cit.cat;document.getElementById('bgImg').src=animeImgs[ci%animeImgs.length];document.getElementById('charName').innerText=perso.name;let h=new Date().getHours();document.getElementById('timeBadge').innerText=h>=6&&h<18?"☀️ MATIN":"🌙 SOIR";}
function nouvelleCitation(){afficher(Math.floor(Math.random()*all.length));}
function partager(){let t=document.getElementById('citation').innerText+" — "+document.getElementById('auteur').innerText+" (WILLIAMS D)";if(navigator.share)navigator.share({title:"WILLIAMS D",text:t});else{navigator.clipboard.writeText(t);alert("Copié!");}}
function ouvrirTout(){document.getElementById('overlay').classList.add('active');renderList(all);}
function fermerTout(){document.getElementById('overlay').classList.remove('active');}
function renderList(data){let h="";data.forEach(cit=>{let oi=all.indexOf(cit);let p=charForEach[oi];let img=animeImgs[oi%animeImgs.length];h+=`<div class="item" onclick="choisir(${oi})"><div class="item-bg"><img src="${img}" loading="lazy"></div><div class="item-gradient"></div><div class="item-char">${p.name}</div><div class="item-content"><div class="item-cat">${cit.cat}</div><div class="item-text">${cit.c}</div><div class="item-author">— ${cit.a}</div></div></div>`;});document.getElementById('list').innerHTML=h;}
function choisir(i){fermerTout();afficher(i);}
function filtrer(){let q=document.getElementById('search').value.toLowerCase();let f=all.filter(c=>c.c.toLowerCase().includes(q)||c.cat.toLowerCase().includes(q)||c.a.toLowerCase().includes(q));renderList(f);}
nouvelleCitation();
</script>
</body>
</html>
